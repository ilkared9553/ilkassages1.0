name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Устанавливаем правильную Java (обязательно для современного Android SDK)
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 2. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Устанавливаем системные пакеты (zip, unzip нужны Buildozer'у для распаковки SDK)
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip cmake libffi-dev libssl-dev libsqlite3-dev libtool pkg-config zlib1g-dev autoconf

    # 4. Устанавливаем сам Buildozer
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    # 5. Собираем APK (команда yes | автоматически принимает все лицензии)
    - name: Build APK
      run: yes | buildozer android debug

    # 6. Сохраняем готовый файл
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ilkassages-apk
        path: bin/*.apk
