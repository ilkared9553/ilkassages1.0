name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev libffi-dev libssl-dev cmake openjdk-17-jdk
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Fix AIDL Path Bug
      run: |
        # Этот блок находит aidl в установленном SDK и создаёт для него глобальную ссылку, чтобы Buildozer его точно увидел
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
        # Заранее создаем структуру, чтобы Buildozer при скачивании SDK подхватил пути
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_HOME/platform-tools

    - name: Build with Buildozer
      run: |
        # Запуск сборки
        buildozer android debug
      env:
        BUILDOZER_ACCEPT_ANDROID_SDK_LICENSES: 1
        # Форсируем использование стабильных инструментов сборки
        ANDROID_BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ilkassages-apk
        path: bin/*.apk
